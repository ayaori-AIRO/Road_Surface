<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road Surface · 관측 대시보드</title>
<style>
:root{color-scheme:dark;--bg:#0c121d;--panel:#131e2d;--line:#263448;--muted:#8da1b9;--ink:#ecf3fc;--accent:#55dfbd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,'Malgun Gothic',sans-serif}header{border-bottom:1px solid var(--line);padding:20px 4%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:750;letter-spacing:2px}.brand span{color:var(--accent)}.badge{border:1px solid var(--line);border-radius:30px;padding:8px 14px;color:var(--muted)}main{max-width:1500px;margin:auto;padding:32px 4%}h1{font-size:29px;letter-spacing:-1px;margin:6px 0 10px}p,.muted{color:var(--muted);line-height:1.7}.eyebrow{color:var(--accent);letter-spacing:2px;font-size:11px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:linear-gradient(145deg,#172538,#111b29);border:1px solid var(--line);border-radius:14px;padding:22px;border-top:3px solid var(--color)}.label{color:var(--muted);font-size:13px}.value{font-size:42px;font-weight:650;letter-spacing:-1.5px;margin:13px 0}.unit{font-size:17px;color:var(--muted);margin-left:7px;letter-spacing:0}.card small{color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:30px 0 15px;flex-wrap:wrap}button{font:inherit;color:var(--muted);background:#152132;border:1px solid var(--line);border-radius:7px;padding:9px 15px;cursor:pointer}button:hover,button.active{background:#234139;color:#8ef1d3;border-color:#397762}.buttons{display:flex;gap:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}.charthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.charthead strong{font-size:15px}.charthead span{color:var(--muted);font-size:12px}canvas{width:100%;height:220px;display:block;touch-action:none;cursor:crosshair}.tip{height:24px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}.range{display:flex;gap:14px;align-items:center;margin:18px 0;color:var(--muted)}input{flex:1;accent-color:var(--accent)}footer{border-top:1px solid var(--line);margin-top:24px;padding-top:16px;display:flex;justify-content:space-between;gap:15px;font-size:12px;color:var(--muted)}.notice{border-left:3px solid #d7ac62;padding:10px 15px;background:#231f19;color:#dec8a3;margin-top:22px;font-size:12px}.live{color:var(--accent)}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.heading{display:block}}@media(max-width:480px){.value{font-size:30px}.card{padding:14px}header{font-size:12px}}
</style>
<header><div class="brand"><span>◈</span> ROAD SURFACE <small class="muted"> / JETSON</small></div><div class="badge" id="connection">● 연결 확인 중</div></header>
<main><div class="heading"><div><div class="eyebrow">SURFACE OBSERVATORY</div><h1>노면 관측 대시보드</h1><p style="margin:0">적설 예측과 환경 센서의 변화를 한눈에 확인하세요.</p></div><div class="muted" id="clock">수신 대기</div></div>
<div class="cards" id="cards"></div>
<div class="notice">시험 운전 · 현재 송신 설정은 가상 거리·속도를 사용합니다. 적설 높이는 실제 적설 측정값이 아닙니다.</div>
<div class="toolbar"><div><strong>시간별 추이</strong><div class="muted" style="font-size:12px;margin-top:6px">휠로 확대 · 드래그로 이동 · 그래프에 마우스를 올려 값 확인</div></div><div class="buttons"><button data-seconds="60">1분</button><button data-seconds="300" class="active">5분</button><button data-seconds="900">15분</button><button data-seconds="3600">1시간</button><button id="live" class="active">● 실시간</button></div></div>
<div class="grid" id="charts"></div><div class="range"><span>과거</span><input id="position" aria-label="관측 이력 시간 이동" type="range" min="0" max="1000" value="1000"><span>최신</span></div>
<footer><span>수신 목표 10 Hz · 온도/습도 갱신 약 1초 · 최근 1시간 메모리 보관</span><span id="summary">데이터 없음</span></footer></main>
<script>
const specs=[['snow_height_mm','적설 높이','mm','#55dfbd','모델 예측'],['road_temperature_c','노면 온도','°C','#ffbd76','CT100'],['air_temperature_c','대기 온도','°C','#72b7ff','FTM02'],['humidity_pct','대기 습도','%','#b69aff','FTM02']];
const $=id=>document.getElementById(id);let rows=[],after=0,span=300000,follow=true,end=Date.now(),last=null,serverOffset=0;
const fmt=(v)=>v===null||v===undefined?'—':Number(v).toFixed(2);const time=t=>new Date(t).toLocaleTimeString('ko-KR',{hour12:false});
specs.forEach(([key,name,unit,color,source])=>{let card=document.createElement('div');card.className='card';card.style.setProperty('--color',color);card.innerHTML=`<div class="label">${name}</div><div class="value"><span id="v-${key}">—</span><span class="unit">${unit}</span></div><small>${source} · <span id="s-${key}">수신 대기</span></small>`;$('cards').append(card);let box=document.createElement('div');box.className='chart';box.innerHTML=`<div class="charthead"><strong>${name}</strong><span>${unit} · 원본값 / 음수 포함</span></div><canvas id="c-${key}" aria-label="${name} 시간 추이"></canvas><div class="tip" id="t-${key}">데이터 수신을 기다리고 있습니다.</div>`;$('charts').append(box)});
function setFollow(value){follow=value;$('live').classList.toggle('active',value)}
function clampEnd(){if(rows.length)end=Math.max(rows[0].received_ms,Math.min(end,Date.now()+serverOffset))}
function draw(){let now=Date.now()+serverOffset;if(follow)end=now;let start=end-span;let visible=rows.filter(r=>r.received_ms>=start&&r.received_ms<=end);specs.forEach(([key,name,unit,color])=>{const c=$('c-'+key),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;let ctx=c.getContext('2d');ctx.scale(dpr,dpr);let left=52,right=w-12,top=14,bottom=h-30,values=visible.map(r=>r[key]).filter(v=>v!==null);let lo=values.length?Math.min(...values):0,hi=values.length?Math.max(...values):1,pad=Math.max((hi-lo)*.12,.1);lo-=pad;hi+=pad;const x=t=>left+(t-start)/span*(right-left),y=v=>bottom-(v-lo)/(hi-lo)*(bottom-top);ctx.font='11px system-ui';ctx.lineWidth=1;for(let i=0;i<5;i++){let yy=top+(bottom-top)*i/4;ctx.strokeStyle='#263448';ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(right,yy);ctx.stroke();ctx.fillStyle='#8da1b9';ctx.fillText((hi-(hi-lo)*i/4).toFixed(1),2,yy+4)}for(let i=0;i<4;i++){ctx.fillStyle='#8da1b9';let xx=left+(right-left)*i/3;ctx.textAlign=i===3?'right':'left';ctx.fillText(time(start+span*i/3),xx,h-8)}ctx.textAlign='left';ctx.strokeStyle=color;ctx.lineWidth=1.7;ctx.beginPath();let prev=null;visible.forEach(r=>{let v=r[key];if(v===null){prev=null;return}if(prev===null||r.received_ms-prev>1000)ctx.moveTo(x(r.received_ms),y(v));else ctx.lineTo(x(r.received_ms),y(v));prev=r.received_ms});ctx.stroke();if(!values.length){ctx.fillStyle='#8da1b9';ctx.textAlign='center';ctx.fillText('이 구간에 유효한 데이터가 없습니다',w/2,h/2)}c.view={start,end,left,right,visible};});if(rows.length){$('position').value=follow?1000:Math.round(1000*(end-rows[0].received_ms)/Math.max(1,now-rows[0].received_ms))}}
let drag=null;specs.forEach(([key,name,unit])=>{let c=$('c-'+key);c.addEventListener('wheel',e=>{e.preventDefault();span=Math.max(10000,Math.min(3600000,span*(e.deltaY>0?1.25:.8)));document.querySelectorAll('[data-seconds]').forEach(b=>b.classList.remove('active'));draw()},{passive:false});c.onpointerdown=e=>{setFollow(false);drag={x:e.clientX,end};c.setPointerCapture(e.pointerId)};c.onpointerup=()=>drag=null;c.onpointercancel=()=>drag=null;c.onpointermove=e=>{if(drag){end=drag.end-(e.clientX-drag.x)/Math.max(1,c.clientWidth-64)*span;clampEnd();draw()}let v=c.view;if(!v||!v.visible.length)return;let xx=e.clientX-c.getBoundingClientRect().left,t=v.start+(xx-v.left)/(v.right-v.left)*span;let nearest=v.visible.reduce((a,b)=>Math.abs(a.received_ms-t)<Math.abs(b.received_ms-t)?a:b);$('t-'+key).textContent=`${time(nearest.received_ms)} · ${fmt(nearest[key])} ${unit}`}});
document.querySelectorAll('[data-seconds]').forEach(b=>b.onclick=()=>{span=Number(b.dataset.seconds)*1000;document.querySelectorAll('[data-seconds]').forEach(x=>x.classList.toggle('active',x===b));draw()});$('live').onclick=()=>{setFollow(true);draw()};$('position').oninput=e=>{setFollow(false);if(rows.length)end=rows[0].received_ms+(Date.now()+serverOffset-rows[0].received_ms)*Number(e.target.value)/1000;draw()};window.onresize=draw;
async function poll(){try{let response=await fetch('/api/data?after='+after);if(!response.ok)throw Error();let data=await response.json();serverOffset=data.server_ms-Date.now();if(data.latest&&data.latest.id<after){rows=[];after=0;return}rows.push(...data.rows);if(data.rows.length)after=data.rows[data.rows.length-1].id;rows=rows.filter(r=>r.received_ms>=data.server_ms-3600000).slice(-36000);last=data.latest;let fresh=last&&data.server_ms-last.received_ms<2000,live=data.connected&&fresh;$('connection').textContent=live?'● 실시간 수신 중':data.connected?'● 데이터 갱신 지연':'○ Raspberry Pi 연결 대기';$('connection').classList.toggle('live',!!live);specs.forEach(([k])=>{$('v-'+k).textContent=fresh?fmt(last[k]):'—';$('s-'+k).textContent=!fresh?'갱신 대기':last[k]===null?'유효값 없음':'정상 수신'});$('clock').textContent=last?'마지막 수신 '+time(last.received_ms):'수신 대기';$('summary').textContent=`보관 ${rows.length.toLocaleString()}개 · 형식 오류 ${data.invalid}개`;draw()}catch(e){$('connection').textContent='○ 대시보드 서버 연결 끊김';$('connection').classList.remove('live');specs.forEach(([k])=>{$('v-'+k).textContent='—';$('s-'+k).textContent='연결 끊김'})}finally{setTimeout(poll,500)}}draw();poll();
</script></html>
